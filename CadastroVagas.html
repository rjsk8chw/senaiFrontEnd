<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Vaga de Emprego</title>
    <link rel="#stilo" href="#stilo.css">
</head>

<body>
    <header>
        <h1>Cadastrar Vaga de Emprego</h1>
    </header>

    <main>
        <section class="form-cadastro">
            <h2>Preencha as informações da vaga</h2>
            <form action="cadastro_vaga.php" method="POST"> 
                <label for="titulo">Título da Vaga:</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" rows="4" required></textarea>

                <label for="requisitos">Requisitos:</label>
                <textarea id="requisitos" name="requisitos" rows="4" required></textarea>

                <label for="salario">Salário:</label>
                <input type="number" id="salario" name="salario" step="0.01" required>

                <label for="localizacao">Localização:</label>
                <input type="text" id="localizacao" name="localizacao" required>

                <label for="tipo_contratacao">Tipo de Contratação:</label>
                <select id="tipo_contratacao" name="tipo_contratacao" required>
                    <option value="CLT">CLT</option>
                    <option value="PJ">PJ</option>
                    <option value="Estágio">Estágio</option>
                    <option value="Freelance">Freelance</option>
                </select>

                <label for="beneficios">Benefícios:</label>
                <textarea id="beneficios" name="beneficios" rows="3"></textarea>

                <label for="data_limite">Data Limite para Inscrição:</label>
                <input type="date" id="data_limite" name="data_limite" required>

                <button type="submit">Cadastrar Vaga</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Sistema de Vagas de Emprego</p>
    </footer>
</body>

</html>
