<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/stilo.css">
    <style>
   </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="div-1 mt-6"  >
              <img src="img/image.png" alt="Imagem" class="imagem"  >
            </div>
                  <div class="div-2">
            <!--AREA DE FORMULARIO -->
            <div class="col-12 mt-5">
                <div class="col-12 titulo_pagina" style="align-items: center;">
                <h1><strong>Cadastrar</strong> <span class="badge bg-primary">Candidato</span></h1>
                <p class="text-justify">Preencha os campos abaixo para se cadastrar.</p>
            </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" placeholder="Digite seu nome completo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CPF</label>
                        <input type="text" class="form-control" maxlength="11" placeholder="Digite seu CPF">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" placeholder="Digite seu e-mail">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefone</label>
                        <input type="text" class="form-control" placeholder="Digite seu telefone">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Endereço</label>
                        <input type="text" class="form-control" placeholder="Digite seu endereço">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Escolaridade</label>
                        <select class="form-control">
                            <option>Ensino Fundamental</option>
                            <option>Ensino Médio</option>
                            <option>Ensino Técnico</option>
                            <option>Ensino Superior</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="inputPassword4" class="form-label">Password</label>
                        <input type="password" class="form-control" id="inputPassword4">
                      </div>
                    <div class="mb-3">
                        <label class="form-label">Área de Interesse</label>
                        <input type="text" class="form-control" placeholder="Digite sua área de interesse">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Experiência Profissional</label>
                        <textarea class="form-control" rows="3" placeholder="Descreva sua experiência profissional"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Currículo</label>
                        <input type="file" id="file" style="display: none;" onchange="updateFileName()">
                        <label for="file" class="btn btn-primary">Escolher Arquivo</label>
                        <span id="file-name" class="ml-2"></span>
                    </div>
                    
                
                    

        
                    
                    
                </form>
                <div class="row">
                    <div class="col-6 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary d-flex justify-content-end">Cadastrar</button>
                    </div>
                    <div class="col-6">
                        <button type="reset" class="btn btn-secondary ">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateFileName() {
            var fileInput = document.getElementById('file');
            var fileName = fileInput.files.length > 0 ? fileInput.files[0].name : '';
            document.getElementById('file-name').textContent = fileName;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</main>
</body>
</html>
