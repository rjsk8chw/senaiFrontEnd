<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Curso</title>
  <link rel="stylesheet" href="css/stilo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="container">
            <div class="div-1 col-mt-6"  >
              <img src="img/image.png" alt="Imagem" class="imagem"  >
            </div>
            <div class="div-2 ">
              <div class="col-12 mt-5">
                <div class="col-12 titulo_pagina" style="align-items: center;">
                <h1><strong>Cadastrar</strong> <span class="badge bg-primary">Curso</span></h1>
                <p class="text-justify">Preencha os campos abaixo para se cadastrar.</p>
            </div>
              <p class="texto-justificado">
               
                <label for="Codigo"><h4 class="text-primary  mt-4">Código:</h4></label>
                <input type="text" id="Codigo" name="Codigo" placeholder="Digite aqui..."
                class="form-control">
             
                <label for="descricao"><h4 class="text-primary  mt-4">Descrição:</h4></label>
                <input type="text" id="descricao" name="descricao" placeholder="Digite aqui..."
                class="form-control">

                <label for="Nivel"><h4 class="text-primary  mt-4">Nivel:</h4></label>
                <input type="text" id="Nivel" name="Nivel" placeholder="Digite aqui..."
                class="form-control">

                <label for="Requisito"><h4 class="text-primary  mt-4">Requisito:</h4></label>
                <input type="text" id="Requisito" name="Requisito" placeholder="Digite aqui..."
                class="form-control">

                <label for="periodo"><h4 class="text-primary  mt-4">Periodo:</h4></label>
                <input type="text" id="periodo" name="periodo" placeholder="Digite aqui..."
                class="form-control">

                <label for="cargahor"><h4 class="text-primary  mt-4">Carga Horaria:</h4></label>
                <input type="text" id="cargahor" name="cargahor" placeholder="Digite aqui..."
                class="form-control">
                
                <label for="tipo"><h4 class="text-primary  mt-4">Tipo:</h4></label>
                <input type="text" id="Tipo" name="Tipo" placeholder="Digite aqui..."
                class="form-control">

                <label for="inst_ensino"><h4 class="text-primary  mt-4">Instituição de Insino:</h4></label>
                <input type="text" id="inst_ensino" name="inst_ensino" placeholder="Digite aqui..."
                class="form-control">

              </p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button class="btn btn-primary me-md-2" type="button">Salvar</button>
                    <button class="btn btn-primary" type="button">Cancelar</button>
                  </div>
       
              </div>
            </div>
          </div>

    </main>
 
</body>
</html>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
