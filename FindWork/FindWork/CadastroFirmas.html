<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Firmas</title>
  <link rel="stylesheet" href="css/stilo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <main>
        <div class="container">
            <div class="div-1">
              <img src="img/image.png" alt="Imagem" class="imagem">
            </div>
            <div class="div-2">
              <div class="col-12 mt-5">
                <div class="col-12 titulo_pagina" style="align-items: center;">
                <h1><strong>Cadastrar</strong> <span class="badge bg-primary">Firma</span></h1>
                <p class="text-justify">Preencha os campos abaixo para se cadastre sua firma.</p>
            </div>
              
              <!-- Este trecho abaixo representa o inicio do cadastro -- Vicente Augusto -->   
              <div class="mb-3">
                <label for="razao-social" class="form-label">Razão Social</label>
                <input type="text" class="form-control" id="razao-social" placeholder="Digite a razão social" required>
              </div>
              
              <div class="mb-3">
                <label for="cnpj" class="form-label">Cnpj</label>
                <input type="text" class="form-control" id="cnpj" placeholder="Digite o CNPJ" required>
              </div>

              <div class="mb-3">
                <label for="cep" class="form-label">Cep</label>
                <input type="text" class="form-control" id="cep" placeholder="Informe seu CEP" required>
              </div>

              <div class="mb-3">
                <label for="QtFuncionarios" class="form-label">Nº Funcionários</label>
                <input type="text" class="form-control" id="QtFuncionarios" placeholder="Nº Funcionários">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="telefone-comercial" class="form-label">Telefone Comercial</label>
                  <input type="text" class="form-control" id="telefone-comercial" placeholder="Tel Comercial">
                </div>
              
                <div class="col-md-6 mb-3">
                  <label for="telefone-celular" class="form-label">Tel Celular / Whatsapp</label >
                  <input type="text" class="form-control" id="telefone-celular" placeholder="(021) Seu Whatsapp" required>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="Site" class="form-label">Site</label>
                  <input type="text" class="form-control" id="Site" placeholder="https://www.seusite.com.br">
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="email" placeholder="contato@seusite.com.br" required>
                </div>
              </div>

              <form action="/seu-processo" method="POST">
                <label>
                  <br><br>
                  <input type="checkbox" name="termos" required>
                 Concordo com o uso das informações fornecidas para fins de recrutamento de candidatos para vagas de emprego, conforme descrito em nossa <a href="PoliticaPrivacidade.html" target="_blank">Política de Privacidade</a>.
                </label><br><br>
              </form>

              <div class="d-grid gap-2 d-md-flex justify-content-center mt-4">
                <button class="btn btn-primary me-md-2" type="button">Salvar</button>
                <button class="btn btn-primary" type="button">Cancelar</button>
              </div>

              
              <div class="mt-4">
                <div class="d-flex justify-content-end">
                  <a href="https://www.instagram.com" target="_blank" class="btn btn-link">
                    <i class="fab fa-instagram fa-2x"></i> Instagram
                  </a>
                  <a href="https://x.com" target="_blank" class="btn btn-link">
                    <i class="fab fa-twitter fa-2x"></i> X (Antigo Twitter)
                  </a>
                  <a href="https://www.facebook.com" target="_blank" class="btn btn-link">
                    <i class="fab fa-facebook fa-2x"></i> Facebook
                  </a>
                  <a href="https://www.youtube.com" target="_blank" class="btn btn-link">
                    <i class="fab fa-youtube fa-2x"></i> YouTube
                  </a>
                </div>
              </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
