
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Vagas</title>
  <link rel="stylesheet" href="css/stilo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>



<body>

    <main>
        <div class="container mt-5">
            <div class="row">
                <!-- Coluna para a Imagem -->
                <div class="col-md-6 d-flex align-items-center justify-content-center">
                    <img src="img/image.png" alt="Imagem" class="img-fluid">
                </div>

                    <!--TODO CONTEUDO DO FORMULARIO -->

        <div class="div-2">
            
            <div class=" col-12 mt-5"> 
                <div class="row align-items-center">

                    <section class="mt-4">
                            <div class="col-12 mt-5">
                                <div class="col-12 titulo_pagina" style="align-items: center;">
                                <h1><strong>Cadastrar</strong> <span class="badge bg-primary">Vagas</span></h1>
                                <p class="text-justify">Preencha os campos abaixo para se cadastrar a vaga que deseja.</p>
                            </div>
                        <form id="formAddNome">
                           
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Nome da Vaga</span>
                                <input type="text" name="nomevaga" id="nomevaga" class="form-control" placeholder="Digite aqui">
                            </div>
                        
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Função da Vaga</span>
                                <input type="text" name="funcao" id="funcao" class="form-control" placeholder="Digite aqui">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Quantidade de Vagas</span>
                                <input type="text" name="quantiVagas" id="quantiVagas" class="form-control" placeholder="Digite aqui">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Requisitos</span>
                                <input type="text" name="requisitos" id="requisitos" class="form-control" placeholder="Digite aqui">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Faixa Salarial</span>
                                <input type="text" name="faixasalario" id="faixasalario" class="form-control" placeholder="Digite aqui">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Tipo de Contrato</span>
                                <input type="text" name="tipo" id="tipo" class="form-control" placeholder="Digite aqui">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Beneficios </span>
                                <input type="text" name="Beneficios" id="Beneficios" class="form-control" placeholder="Digite aqui">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Localizaçã da Vaga </span>
                                <input type="text" name="localVaga" id="localVaga" class="form-control" placeholder="Digite aqui">
                            </div>
                            
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Horario de Trabalho </span>
                                <input type="text" name="horario" id="horario" class="form-control" placeholder="Digite aqui">
                            </div>
                            
                            <div class="input-group mb-3">
                                <span class="input-group-text text-primary">Data de Limite</span>
                                <input type="date" name="data" id="data" class="form-control">
                            </div>
                        
                           
                        <div class="mt-3">
                            <label class="form-label">Informações da Vaga</label>
                            <textarea class="form-control" rows="3" placeholder="Descreva sua experiência profissional"></textarea>
                        </div>                 
                   

                            <div class="row align-items-center">
                                
                            <div class="col-md-6 mt-4">
                                <button type="submit" class="btn btn-primary w-100 botoes-peq" >Confirmar</button>
                            </div>

                            <div class="col-md-6 mt-4">
                                <button type="submit" class="btn btn-primary w-100">Cancelar</button>
                            </div>
                                
                                
                            
                        </div>
        
                  </div>
        
                    </section>
                </div>
                
            </div>    
            
        </div>  
        

    </main>
 
</body>
</html>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
