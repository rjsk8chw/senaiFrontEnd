<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Curso</title>
  <link rel="stylesheet" href="css/stilo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="container">
            <div class="div-1 mt-6"  >
              <img src="img/image.png" alt="Imagem" class="imagem"  >
            </div>
            <div class="div-2 mt-6 ">
              <h1 class="text-primary  mt-4">C a d a s t r a r  &nbsp; F i r m a </h1>
              <p class="texto-justificado">
               
               
                <!--RAZAO SOCIAL-->
                <label for="razao"><h4 class="text-primary  mt-4">Razão Social:</h4></label>
                  <div class="input-group mb-3">
                    <input type="text" id="razao" name="razao" placeholder="Digite aqui..."
                    class="form-control">
                  </div>
                 
                 
                 
                  <!--DESCRIÇÂO-->
                  <label for="CNPJ"><h4 class="text-primary  mt-4">Descrição:</h4></label>
                  <div class="input-group mb-3">
                    <input type="text" id="descricao" name="descricao" placeholder="Digite aqui..."
                    class="form-control">
                  </div>
                  
                  
                  
                  <!--CEP-->
                  <label for="CEP"><h4 class="text-primary  mt-4">CEP:</h4></label>
                    <div class="input-group mb-3">
                      <input type="text" id="cep" name="cep" placeholder="Digite aqui..."
                      class="form-control">
                    </div>

                  <!--NUMERO DE CANDIDATOS-->

                  <label for="numeroFunc"><h4 class="text-primary  mt-4">Numero de Funcionários:</h4></label>

                  <div class="input-group mb-3">
                    <input type="number" id="Requisito" name="Requisito" placeholder="Digite aqui..."
                    class="form-control">
                  </div>
                  <!--TELEFONE-->
                  <label for="telefone"><h4 class="text-primary  mt-4">Telfone</h4></label>
                  <div class="input-group mb-3">
                    <input type="text" maxlength="11" id="telefone" name="telefone" placeholder="Digite aqui..."
                    class="form-control">
                  </div>
                 <!--EMAIL-->
                 <label for="email"><h4 class="text-primary  mt-4">Email</h4></label>
                  <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Digite" aria-label="Username">
                    <span class="input-group-text">@</span>
                    <input type="text" class="form-control" placeholder="Domain" aria-label="Server">
                  </div>
                  <!--SITE-->
                  <div class="mb-3">
                    <label for="basic-url" class="form-label"><h4 class="text-primary  mt-4">Seu Site</h4></label>
                    <div class="input-group">
                      <span class="input-group-text" id="basic-addon3">https://example.com/users/</span>
                      <input type="text" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
                    </div>
                  </div>
                  <!--REDE SOCIAL-->
                  <div class="input-group mb-3">
                    
                    <div class="input-group">
                      <label for="basic-url" class="form-label"><h4 class="text-primary  mt-4">Rede Social</h4></label>
                    
                    </div>
                  
                    <span class="input-group-text" id="basic-addon1">@</span>
                    <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
                  </div>

              
              </p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button class="btn btn-primary me-md-2" type="button">Salvar</button>
                    <button class="btn btn-primary" type="button">Cancelar</button>
                  </div>
       
              </div>
            </div>
          </div>

    </main>
 
</body>
</html>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
