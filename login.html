<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/stilo.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="container">
            <div class="div-1"  >
              <img src="img/image.png" alt="Imagem" class="imagem" >
            </div>
            <div class="div-2">
              <h1 class="titulo">L o g i n</h1>
              <p class="texto-justificado">

                <label for="usuario"><h3>Usuario ou Email:</h3></label></br>
                <input type="text" id="usuario" name="usuario" placeholder="Digite aqui..."
                class="form-control"></br>

            </p>
            <label for="inputPassword5" class="form-label">Password</label>
            <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text">
                Sua senha de pussuir de 8 - 20 caracter, conter letras e numeros , e não pode ter espaço , carcter especial ou emoji.
              
            </div>

              <p>
              <p>
              
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button class="btn btn-primary me-md-2" type="button">Logar-se</button>
                    <button class="btn btn-primary" type="button">Cancelar</button>
                  </div>
       
              </div>
            </div>
          </div>

    </main>
 
</body>
</html>
